name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      # Fails on any test failure or when JaCoCo coverage drops below the
      # thresholds in pom.xml (85% line, 70% branch; GUI view excluded).
      - name: Build, test and check coverage
        run: mvn -B verify

      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
          retention-days: 30

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: virtual-calendar-jar
          path: target/virtual-calendar.jar
          retention-days: 90
